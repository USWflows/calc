<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TI-84 Plus CE - Ultra-Realistic Scientific Graphing Calculator</title>
  <style>
    :root {
      /* Realistic Body Colors */
      --case-main: #181b20;
      --case-gradient: linear-gradient(165deg, #2a2e37 0%, #16181d 50%, #0d0e11 100%);
      --case-side: #090a0c;
      --bezel-dark: #0f1115;
      
      /* Display Screen Colors (Realistic Matte Dark LCD) */
      --screen-bg: #1c241c;
      --screen-text: #8fb38b;
      --screen-dim: rgba(143, 179, 139, 0.4);
      --screen-pixel-grid: rgba(0, 0, 0, 0.25);
      
      /* Button Palette */
      --btn-gray: #3a414d;
      --btn-gray-side: #1f232b;
      --btn-dark: #292d36;
      --btn-dark-side: #14161b;
      --btn-blue: #2563eb;
      --btn-blue-side: #1d4ed8;
      --btn-green: #16a34a;
      --btn-green-side: #15803d;
      --btn-orange: #ea580c;
      --btn-orange-side: #c2410c;
      --btn-white: #d1d5db;
      --btn-white-side: #9ca3af;
      --sub-blue: #60a5fa;
      --sub-green: #4ade80;
    }

    * { box-sizing: border-box; user-select: none; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at 50% 30%, #1f242d, #08090c);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      perspective: 1600px;
      padding: 20px 0;
    }

    /* Calculator Shell Chassis */
    .calculator-chassis {
      width: 470px;
      background: var(--case-gradient);
      border-radius: 36px 36px 48px 48px;
      padding: 24px 22px 32px 22px;
      box-shadow: 
        -25px 35px 60px rgba(0, 0, 0, 0.9),
        inset 1px 1px 2px rgba(255, 255, 255, 0.2),
        inset -2px -3px 6px rgba(0, 0, 0, 0.8),
        0 20px 0 var(--case-side);
      transform-style: preserve-3d;
      transform: rotateX(10deg) rotateY(-1deg);
      transition: transform 0.25s ease-out;
      position: relative;
      border: 1px solid #333a46;
    }

    .calculator-chassis:hover {
      transform: rotateX(2deg) rotateY(0deg);
    }

    /* Top Branding Row */
    .brand-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding: 0 6px;
    }

    .logo {
      color: #9ca3af;
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 1.5px;
    }

    .logo span { color: var(--sub-blue); }

    .solar-strip {
      width: 80px;
      height: 16px;
      background: linear-gradient(90deg, #2b1100, #4a1f00, #2b1100);
      border-radius: 3px;
      border: 1px solid #140700;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.9);
    }

    /* Screen Housing Frame */
    .screen-bezel {
      background: var(--bezel-dark);
      padding: 12px;
      border-radius: 16px;
      border: 2px solid #282d37;
      box-shadow: inset 0 4px 14px rgba(0,0,0,0.95);
      margin-bottom: 18px;
    }

    /* Matte Dark LCD Glass Screen */
    .screen-glass {
      background: var(--screen-bg);
      height: 185px;
      border-radius: 6px;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 
        inset 0 0 20px rgba(0, 0, 0, 0.8),
        inset 0 2px 4px rgba(0, 0, 0, 0.9);
      position: relative;
      overflow: hidden;
      border: 1px solid #2d3b2d;
    }

    /* Subpixel Scanlines & Anti-Glare Vignette */
    .screen-glass::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: 
        linear-gradient(rgba(0,0,0,0.15) 50%, rgba(0, 0, 0, 0) 50%),
        radial-gradient(circle at 50% 50%, transparent 60%, rgba(0,0,0,0.4) 100%);
      background-size: 100% 3px, 100% 100%;
      pointer-events: none;
      z-index: 3;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      font-family: 'Courier New', monospace;
      font-size: 0.72rem;
      color: var(--screen-dim);
      font-weight: bold;
      border-bottom: 1px dashed rgba(143, 179, 139, 0.25);
      padding-bottom: 4px;
      z-index: 2;
    }

    .status-bar span.active {
      color: var(--screen-text);
      text-shadow: 0 0 5px rgba(143, 179, 139, 0.6);
    }

    .screen-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      font-family: 'Courier New', monospace;
      z-index: 2;
    }

    .history-line {
      font-size: 0.95rem;
      color: var(--screen-dim);
      text-align: right;
      min-height: 1.3rem;
      overflow: hidden;
      white-space: nowrap;
    }

    .main-line {
      font-size: 1.85rem;
      font-weight: bold;
      color: var(--screen-text);
      text-align: right;
      word-break: break-all;
      text-shadow: 0 0 4px rgba(143, 179, 139, 0.5);
    }

    /* Graph Canvas Viewport */
    #graph-viewport {
      display: none;
      width: 100%;
      height: 135px;
      background: var(--screen-bg);
      border-radius: 4px;
      z-index: 2;
    }

    /* Function Key Row (F1-F5) */
    .f-key-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    /* Nav D-Pad Section */
    .control-row {
      display: grid;
      grid-template-columns: 1fr 1.2fr 1fr;
      gap: 12px;
      align-items: center;
      margin-bottom: 14px;
    }

    .dpad-container {
      width: 86px;
      height: 86px;
      background: #111317;
      border-radius: 50%;
      position: relative;
      box-shadow: 0 4px 0 #07080a, inset 0 2px 4px rgba(255,255,255,0.08);
      margin: 0 auto;
    }

    .dpad-btn {
      position: absolute;
      background: #252a33;
      border: none;
      color: #9ca3af;
      font-size: 0.65rem;
      cursor: pointer;
      width: 28px;
      height: 28px;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background 0.05s;
    }

    .dpad-btn:active { background: var(--btn-blue); color: #fff; }
    .dpad-up { top: 2px; left: 29px; border-radius: 6px 6px 0 0; }
    .dpad-down { bottom: 2px; left: 29px; border-radius: 0 0 6px 6px; }
    .dpad-left { top: 29px; left: 2px; border-radius: 6px 0 0 6px; }
    .dpad-right { top: 29px; right: 2px; border-radius: 0 6px 6px 0; }

    /* Button Grid Layout */
    .main-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .key-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .key-labels {
      display: flex;
      justify-content: space-between;
      width: 100%;
      padding: 0 3px;
      height: 12px;
    }

    .sub-2nd { font-size: 0.58rem; font-weight: 800; color: var(--sub-blue); }
    .sub-alpha { font-size: 0.58rem; font-weight: 800; color: var(--sub-green); }

    /* Realistic Beveled Buttons */
    .btn {
      width: 100%;
      appearance: none;
      border: none;
      outline: none;
      padding: 9px 0;
      font-size: 0.8rem;
      font-weight: 700;
      border-radius: 5px;
      cursor: pointer;
      background: var(--btn-dark);
      color: #e5e7eb;
      box-shadow: 0 4px 0 var(--btn-dark-side), 0 5px 6px rgba(0,0,0,0.6);
      position: relative;
      top: 0;
      transition: all 0.03s ease;
    }

    .btn:active {
      top: 3px;
      box-shadow: 0 1px 0 var(--btn-dark-side), 0 2px 3px rgba(0,0,0,0.6);
    }

    /* Key Color Styles */
    .btn.blue { background: var(--btn-blue); box-shadow: 0 4px 0 var(--btn-blue-side); color: #fff; }
    .btn.blue:active { box-shadow: 0 1px 0 var(--btn-blue-side); }

    .btn.green { background: var(--btn-green); box-shadow: 0 4px 0 var(--btn-green-side); color: #fff; }
    .btn.green:active { box-shadow: 0 1px 0 var(--btn-green-side); }

    .btn.orange { background: var(--btn-orange); box-shadow: 0 4px 0 var(--btn-orange-side); color: #fff; }
    .btn.orange:active { box-shadow: 0 1px 0 var(--btn-orange-side); }

    .btn.white { background: var(--btn-white); color: #111827; box-shadow: 0 4px 0 var(--btn-white-side); }
    .btn.white:active { box-shadow: 0 1px 0 var(--btn-white-side); }

    .btn.gray { background: var(--btn-gray); box-shadow: 0 4px 0 var(--btn-gray-side); color: #fff; }
    .btn.gray:active { box-shadow: 0 1px 0 var(--btn-gray-side); }

    .span-2 { grid-column: span 2; }
  </style>
</head>
<body>

  <div class="calculator-chassis">
    <div class="brand-header">
      <div class="logo">TI-84 Plus CE <span>PYTHON</span></div>
      <div class="solar-strip"></div>
    </div>

    <div class="screen-bezel">
      <div class="screen-glass">
        <div class="status-bar">
          <span id="st-2nd">2nd</span>
          <span id="st-alpha">ALPHA</span>
          <span id="st-deg" class="active">DEG</span>
          <span id="st-mode" class="active">NORMAL</span>
        </div>

        <canvas id="graph-viewport"></canvas>

        <div class="screen-content" id="calc-screen">
          <div class="history-line" id="hist-line"></div>
          <div class="main-line" id="main-line">0</div>
        </div>
      </div>
    </div>

    <div class="f-key-row">
      <div class="key-wrapper"><div class="key-labels"><span class="sub-2nd">stat plot</span><span class="sub-alpha">f1</span></div><button class="btn gray" onclick="triggerGraph()">y=</button></div>
      <div class="key-wrapper"><div class="key-labels"><span class="sub-2nd">tblset</span><span class="sub-alpha">f2</span></div><button class="btn gray" onclick="triggerGraph()">window</button></div>
      <div class="key-wrapper"><div class="key-labels"><span class="sub-2nd">format</span><span class="sub-alpha">f3</span></div><button class="btn gray" onclick="toggleAngle()">mode</button></div>
      <div class="key-wrapper"><div class="key-labels"><span class="sub-2nd">calc</span><span class="sub-alpha">f4</span></div><button class="btn gray" onclick="triggerGraph()">trace</button></div>
      <div class="key-wrapper"><div class="key-labels"><span class="sub-2nd">table</span><span class="sub-alpha">f5</span></div><button class="btn gray" onclick="triggerGraph()">graph</button></div>
    </div>

    <div class="control-row">
      <div class="key-wrapper"><div class="key-labels"><span class="sub-2nd">QUIT</span></div><button class="btn blue" onclick="toggle2nd()">2nd</button></div>
      
      <div class="dpad-container">
        <button class="dpad-btn dpad-up" onclick="nav('up')">▲</button>
        <button class="dpad-btn dpad-down" onclick="nav('down')">▼</button>
        <button class="dpad-btn dpad-left" onclick="nav('left')">◀</button>
        <button class="dpad-btn dpad-right" onclick="nav('right')">▶</button>
      </div>

      <div class="key-wrapper"><div class="key-labels"><span class="sub-alpha">A-LOCK</span></div><button class="btn green" onclick="toggleAlpha()">alpha</button></div>
    </div>

    <div class="main-grid">
      <div class="key-wrapper"><div class="key-labels"><span class="sub-2nd">sin⁻¹</span><span class="sub-alpha">E</span></div><button class="btn" onclick="execTrig('sin')">sin</button></div>
      <div class="key-wrapper"><div class="key-labels"><span class="sub-2nd">cos⁻¹</span><span class="sub-alpha">F</span></div><button class="btn" onclick="execTrig('cos')">cos</button></div>
      <div class="key-wrapper"><div class="key-labels"><span class="sub-2nd">tan⁻¹</span><span class="sub-alpha">G</span></div><button class="btn" onclick="execTrig('tan')">tan</button></div>
      <div class="key-wrapper"><div class="key-labels"><span class="sub-2nd">π</span><span class="sub-alpha">H</span></div><button class="btn" onclick="appendVal('Math.PI')">π</button></div>
      <div class="key-wrapper"><div class="key-labels"><span class="sub-2nd">RESET</span></div><button class="btn orange" onclick="clearAll()">clear</button></div>

      <div class="key-wrapper"><div class="key-labels"><span class="sub-2nd">10ˣ</span><span class="sub-alpha">N</span></div><button class="btn" onclick="insertFunc('Math.log10')">log</button></div>
      <div class="key-wrapper"><div class="key-labels"><span class="sub-2nd">eˣ</span><span class="sub-alpha">S</span></div><button class="btn" onclick="insertFunc('Math.log')">ln</button></div>
      <div class="key-wrapper"><div class="key-labels"><span class="sub-2nd">x√</span><span class="sub-alpha">M</span></div><button class="btn" onclick="appendVal('**')">xʸ</button></div>
      <div class="key-wrapper"><div class="key-labels"><span class="sub-2nd">√</span><span class="sub-alpha">I</span></div><button class="btn" onclick="insertFunc('Math.sqrt')">√</button></div>
      <div class="key-wrapper"><div class="key-labels"><span class="sub-2nd">x⁻¹</span><span class="sub-alpha">D</span></div><button class="btn" onclick="appendVal('**2')">x²</button></div>

      <div class="key-wrapper"><div class="key-labels"><span class="sub-2nd">n!</span><span class="sub-alpha">P</span></div><button class="btn" onclick="execFactorial()">n!</button></div>
      <div class="key-wrapper"><div class="key-labels"><span class="sub-2nd">d/dx</span></div><button class="btn" onclick="execDerivative()">d/dx</button></div>
      <div class="key-wrapper"><div class="key-labels"><span class="sub-2nd">∫dx</span></div><button class="btn" onclick="execIntegral()">∫dx</button></div>
      <div class="key-wrapper"><div class="key-labels"><span class="sub-2nd">Σ</span></div><button class="btn" onclick="execSummation()">Σ</button></div>
      <div class="key-wrapper"><div class="key-labels"><span class="sub-2nd">INS</span></div><button class="btn gray" onclick="backspace()">del</button></div>

      <div class="key-wrapper"><div class="key-labels"><span class="sub-2nd">{</span><span class="sub-alpha">K</span></div><button class="btn" onclick="appendVal('(')">(</button></div>
      <div class="key-wrapper"><div class="key-labels"><span class="sub-2nd">}</span><span class="sub-alpha">L</span></div><button class="btn" onclick="appendVal(')')">)</button></div>
      <div class="key-wrapper"><div class="key-labels"><span class="sub-2nd">i</span><span class="sub-alpha">Q</span></div><button class="btn" onclick="appendVal('i')">i</button></div>
      <div class="key-wrapper"><div class="key-labels"><span class="sub-2nd">abs</span></div><button class="btn" onclick="insertFunc('Math.abs')">abs</button></div>
      <div class="key-wrapper"><div class="key-labels"><span class="sub-2nd">e</span><span class="sub-alpha">R</span></div><button class="btn orange" onclick="appendVal('/')">÷</button></div>

      <div class="key-wrapper"><div class="key-labels"><span class="sub-2nd">u</span><span class="sub-alpha">A</span></div><button class="btn white" onclick="appendVal('7')">7</button></div>
      <div class="key-wrapper"><div class="key-labels"><span class="sub-2nd">v</span><span class="sub-alpha">B</span></div><button class="btn white" onclick="appendVal('8')">8</button></div>
      <div class="key-wrapper"><div class="key-labels"><span class="sub-2nd">w</span><span class="sub-alpha">C</span></div><button class="btn white" onclick="appendVal('9')">9</button></div>
      <div class="key-wrapper"><div class="key-labels"><span class="sub-2nd">n/d</span></div><button class="btn" onclick="insertFunc('Math.trunc')">int</button></div>
      <div class="key-wrapper"><div class="key-labels"><span class="sub-2nd">[</span><span class="sub-alpha">T</span></div><button class="btn orange" onclick="appendVal('*')">×</button></div>

      <div class="key-wrapper"><div class="key-labels"><span class="sub-2nd">L4</span><span class="sub-alpha">U</span></div><button class="btn white" onclick="appendVal('4')">4</button></div>
      <div class="key-wrapper"><div class="key-labels"><span class="sub-2nd">L5</span><span class="sub-alpha">V</span></div><button class="btn white" onclick="appendVal('5')">5</button></div>
      <div class="key-wrapper"><div class="key-labels"><span class="sub-2nd">L6</span><span class="sub-alpha">W</span></div><button class="btn white" onclick="appendVal('6')">6</button></div>
      <div class="key-wrapper"><div class="key-labels"><span class="sub-2nd">1/x</span></div><button class="btn" onclick="execReciprocal()">1/x</button></div>
      <div class="key-wrapper"><div class="key-labels"><span class="sub-2nd">]</span><span class="sub-alpha">X</span></div><button class="btn orange" onclick="appendVal('-')">-</button></div>

      <div class="key-wrapper"><div class="key-labels"><span class="sub-2nd">L1</span><span class="sub-alpha">Y</span></div><button class="btn white" onclick="appendVal('1')">1</button></div>
      <div class="key-wrapper"><div class="key-labels"><span class="sub-2nd">L2</span><span class="sub-alpha">Z</span></div><button class="btn white" onclick="appendVal('2')">2</button></div>
      <div class="key-wrapper"><div class="key-labels"><span class="sub-2nd">L3</span><span class="sub-alpha">θ</span></div><button class="btn white" onclick="appendVal('3')">3</button></div>
      <div class="key-wrapper"><div class="key-labels"><span class="sub-2nd">sto→</span></div><button class="btn" onclick="toggleSign()">(-)</button></div>
      <div class="key-wrapper"><div class="key-labels"><span class="sub-2nd">MEM</span></div><button class="btn orange" onclick="appendVal('+')">+</button></div>

      <div class="key-wrapper span-2"><div class="key-labels"><span class="sub-2nd">CATALOG</span></div><button class="btn white" onclick="appendVal('0')">0</button></div>
      <div class="key-wrapper"><div class="key-labels"><span class="sub-2nd">i</span></div><button class="btn white" onclick="appendVal('.')">.</button></div>
      <div class="key-wrapper span-2"><div class="key-labels"><span class="sub-2nd">ENTRY</span></div><button class="btn blue" onclick="calculate()">enter</button></div>
    </div>
  </div>

  <script>
    let expr = '';
    let isRad = false;
    let is2nd = false;
    let isAlpha = false;
    let isEvaluated = false;
    let isGraphVisible = false;

    let historyStack = [];
    let historyIndex = -1;

    const mainLine = document.getElementById('main-line');
    const histLine = document.getElementById('hist-line');
    const graphCanvas = document.getElementById('graph-viewport');
    const calcScreen = document.getElementById('calc-screen');
    const ctx = graphCanvas.getContext('2d');

    function updateDisplay(val) {
      mainLine.innerText = val || expr || '0';
    }

    function toggle2nd() {
      is2nd = !is2nd;
      const el = document.getElementById('st-2nd');
      if (is2nd) el.classList.add('active'); else el.classList.remove('active');
    }

    function toggleAlpha() {
      isAlpha = !isAlpha;
      const el = document.getElementById('st-alpha');
      if (isAlpha) el.classList.add('active'); else el.classList.remove('active');
    }

    function toggleAngle() {
      isRad = !isRad;
      document.getElementById('st-deg').innerText = isRad ? 'RAD' : 'DEG';
    }

    function appendVal(val) {
      if (isEvaluated) { expr = ''; isEvaluated = false; }
      expr += val;
      updateDisplay();
    }

    function insertFunc(func) {
      if (isEvaluated) { expr = ''; isEvaluated = false; }
      expr += func + '(';
      updateDisplay();
    }

    function execTrig(type) {
      let func = is2nd ? 'asin' : type;
      if (type === 'cos' && is2nd) func = 'acos';
      if (type === 'tan' && is2nd) func = 'atan';

      if (is2nd) toggle2nd();
      insertFunc(`TRIG_${func.toUpperCase()}`);
    }

    function clearAll() {
      expr = '';
      histLine.innerText = '';
      isEvaluated = false;
      isGraphVisible = false;
      graphCanvas.style.display = 'none';
      calcScreen.style.display = 'flex';
      updateDisplay('0');
    }

    function backspace() {
      if (isEvaluated) return;
      expr = expr.slice(0, -1);
      updateDisplay();
    }

    function toggleSign() {
      if (!expr) return;
      expr = expr.startsWith('-') ? expr.substring(1) : '-' + expr;
      updateDisplay();
    }

    // Mathematical Operations Engine
    function execFactorial() {
      try {
        let n = parseInt(eval(parseExpr(expr)));
        if (isNaN(n) || n < 0) throw new Error();
        let f = 1;
        for (let i = 1; i <= n; i++) f *= i;
        histLine.innerText = `${n}! =`;
        expr = String(f);
        isEvaluated = true;
        updateDisplay();
      } catch (e) { updateDisplay('DOMAIN ERROR'); expr = ''; }
    }

    function execDerivative() {
      try {
        let val = parseFloat(eval(parseExpr(expr)) || 0);
        let h = 0.00001;
        let f = x => Math.pow(x, 2) + Math.sin(x);
        let deriv = (f(val + h) - f(val - h)) / (2 * h);
        histLine.innerText = `d/dx(x²+sin x) [x=${val}] =`;
        expr = String(Number(deriv.toFixed(5)));
        isEvaluated = true;
        updateDisplay();
      } catch (e) { updateDisplay('SYNTAX ERROR'); expr = ''; }
    }

    function execIntegral() {
      try {
        let b = parseFloat(eval(parseExpr(expr)) || 1);
        let a = 0, n = 100, h = (b - a) / n;
        let f = x => Math.sin(x) + Math.cos(x);
        let sum = f(a) + f(b);
        for (let i = 1; i < n; i++) {
          sum += f(a + i * h) * (i % 2 === 0 ? 2 : 4);
        }
        let integral = (h / 3) * sum;
        histLine.innerText = `∫(sin+cos)dx [0,${b}] =`;
        expr = String(Number(integral.toFixed(5)));
        isEvaluated = true;
        updateDisplay();
      } catch(e) { updateDisplay('SYNTAX ERROR'); expr = ''; }
    }

    function execSummation() {
      try {
        let max = parseInt(eval(parseExpr(expr)) || 10);
        let sum = 0;
        for (let i = 1; i <= max; i++) sum += i * i;
        histLine.innerText = `Σ(i²) [1..${max}] =`;
        expr = String(sum);
        isEvaluated = true;
        updateDisplay();
      } catch(e) { updateDisplay('SYNTAX ERROR'); expr = ''; }
    }

    function execReciprocal() {
      try {
        let v = eval(parseExpr(expr));
        expr = String(Number((1 / v).toFixed(8)));
        isEvaluated = true;
        updateDisplay();
      } catch(e) { updateDisplay('DIV BY 0'); expr = ''; }
    }

    function parseExpr(raw) {
      let p = raw;
      const toRad = deg => deg * (Math.PI / 180);
      const toDeg = rad => rad * (180 / Math.PI);

      ['SIN', 'COS', 'TAN', 'ASIN', 'ACOS', 'ATAN'].forEach(fn => {
        let regex = new RegExp(`TRIG_${fn}\\(([^)]+)\\)`, 'g');
        p = p.replace(regex, (_, arg) => {
          let num = eval(arg);
          if (fn.startsWith('A')) {
            let res = Math[fn.toLowerCase()](num);
            return isRad ? res : toDeg(res);
          } else {
            let radArg = isRad ? num : toRad(num);
            return Math[fn.toLowerCase()](radArg);
          }
        });
      });
      return p.replace(/i/g, 'Math.SQRT1_2');
    }

    function calculate() {
      try {
        if (!expr) return;
        historyStack.push(expr);
        historyIndex = historyStack.length;

        histLine.innerText = expr.replace(/TRIG_/g, '').replace(/Math\./g, '') + ' =';

        let parsed = parseExpr(expr);
        let res = Function('"use strict"; return (' + parsed + ')')();

        if (typeof res === 'number' && !Number.isInteger(res)) {
          res = Number(res.toFixed(8));
        }

        expr = String(res);
        isEvaluated = true;
        updateDisplay();
      } catch (e) {
        updateDisplay('SYNTAX ERROR');
        expr = '';
      }
    }

    function nav(dir) {
      if (dir === 'up' && historyIndex > 0) {
        historyIndex--;
        expr = historyStack[historyIndex];
        updateDisplay();
      } else if (dir === 'down' && historyIndex < historyStack.length - 1) {
        historyIndex++;
        expr = historyStack[historyIndex];
        updateDisplay();
      }
    }

    function triggerGraph() {
      isGraphVisible = !isGraphVisible;
      if (isGraphVisible) {
        calcScreen.style.display = 'none';
        graphCanvas.style.display = 'block';
        drawGraph();
      } else {
        graphCanvas.style.display = 'none';
        calcScreen.style.display = 'flex';
      }
    }

    function drawGraph() {
      graphCanvas.width = graphCanvas.offsetWidth;
      graphCanvas.height = graphCanvas.offsetHeight;
      ctx.clearRect(0, 0, graphCanvas.width, graphCanvas.height);

      const w = graphCanvas.width;
      const h = graphCanvas.height;

      // Draw Grid Lines
      ctx.strokeStyle = '#233223';
      ctx.lineWidth = 1;
      for (let x = 0; x < w; x += 15) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
      }
      for (let y = 0; y < h; y += 15) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
      }

      // Draw Axis
      ctx.strokeStyle = '#8fb38b';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(0, h / 2); ctx.lineTo(w, h / 2);
      ctx.moveTo(w / 2, 0); ctx.lineTo(w / 2, h);
      ctx.stroke();

      // Plot Graph Function
      ctx.strokeStyle = '#8fb38b';
      ctx.lineWidth = 2;
      ctx.beginPath();

      for (let px = 0; px < w; px++) {
        let x = (px - w / 2) / 10;
        let y = Math.sin(x) * (x * 0.4);
        let py = h / 2 - (y * 15);
        if (px === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.stroke();
    }

    // Keyboard Bindings
    document.addEventListener('keydown', (e) => {
      if ((e.key >= '0' && e.key <= '9') || e.key === '.') appendVal(e.key);
      if (['+', '-', '*', '/'].includes(e.key)) appendVal(e.key);
      if (e.key === 'Enter' || e.key === '=') calculate();
      if (e.key === 'Backspace') backspace();
      if (e.key === 'Escape') clearAll();
      if (e.key === 'ArrowUp') nav('up');
      if (e.key === 'ArrowDown') nav('down');
    });
  </script>
</body>
</html>
